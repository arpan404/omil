<!doctype html>
<!-- The link preview image (public/media/og.png), 1200 x 630. Render it with `bun run og`.
     Everything important sits in the middle, so a square crop still reads. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Geist";
        src: url("../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2") format("woff2");
        font-weight: 100 900;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        background:
          radial-gradient(70% 60% at 50% 0%, #1d1d21 0%, transparent 70%),
          #0a0a0b;
        color: #f5f5f6;
        font-family: "Geist", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-align: center;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-top: 64px;
        font-size: 34px;
        font-weight: 600;
        letter-spacing: -0.03em;
      }
      .brand img {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        box-shadow: 0 0 0 1px rgb(255 255 255 / 0.14);
      }
      h1 {
        margin-top: 46px;
        font-size: 104px;
        font-weight: 600;
        line-height: 1;
        letter-spacing: -0.052em;
      }
      p {
        margin-top: 30px;
        font-size: 34px;
        letter-spacing: -0.015em;
        color: #a3a3ab;
      }
      /* The level meter, as on the site. */
      .wave {
        position: absolute;
        inset: auto 0 0 0;
        height: 190px;
        -webkit-mask-image: linear-gradient(to right, transparent, #000 12%, #000 88%, transparent);
      }
      .wave i {
        position: absolute;
        bottom: -6px;
        width: 7px;
        border-radius: 4px;
        background: rgb(255 255 255 / 0.2);
      }
    </style>
  </head>
  <body>
    <div class="brand"><img src="../public/media/icon-192.png" alt="" />Omil</div>
    <h1>You think faster<br />than you type.</h1>
    <p>Free, private dictation for your Mac.</p>
    <div class="wave" id="wave"></div>
    <script>
      // The same shape as src/scripts/wave.ts: slow swells with finer detail on top.
      const hash = (i) => {
        const s = Math.sin(i * 127.1 + 311.7) * 43758.5453;
        return s - Math.floor(s);
      };
      const wave = document.getElementById("wave");
      const pitch = 14;
      const n = Math.floor(1200 / pitch);
      for (let i = 0; i < n; i++) {
        const swell = 0.5 + 0.25 * Math.sin(i * 0.21 + 1.3) + 0.25 * Math.sin(i * 0.083 + 4.1);
        const level = 0.25 + 0.75 * (0.6 * swell + 0.4 * hash(i));
        const bar = document.createElement("i");
        bar.style.left = `${(1200 - (n - 1) * pitch) / 2 + i * pitch - 3.5}px`;
        bar.style.height = `${Math.round(18 + level * 150)}px`;
        wave.append(bar);
      }
    </script>
  </body>
</html>
